<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ===================================================================== -->
<!-- 🌕 満月ワークシート 配布ページ（固定URL・毎月中身だけ差し替える）      -->
<!--                                                                       -->
<!-- 【ファイル名】mangetsu-download.html（変えない）                       -->
<!--   → URLが固定されるので、公式LINEの設定を毎月触らずに済みます          -->
<!--                                                                       -->
<!-- 【毎月差し替えるのは4か所だけ】                                        -->
<!--   1. <title>　2. 画像3枚のファイル名　3. ボタンのリンク先              -->
<!--   4. ページ下部の注釈                                                  -->
<!--                                                                       -->
<!-- 【GoatCounterのイベント名】固定のまま                                  -->
<!--   open-mangetsu-digital / download-mangetsu-pdf                        -->
<!-- ===================================================================== -->

<title>魚座満月｜ここまでの私に、実りを見つける満月。｜ワークシート</title>

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">

<!-- アクセス解析（GoatCounter） -->
<script data-goatcounter="https://moca.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream:    #FBF8F3;
  --gold:     #FDF4DC;
  --gold-bd:  #E2C878;
  --gold-dk:  #B08F3C;
  --lav-dk:   #8A6FB5;
  --border:   #DCCFBE;
  --text:     #5C4A38;
  --text-md:  #8B7260;
  --text-lt:  #B09880;
}
body {
  font-family: 'M PLUS Rounded 1c', sans-serif;
  background: #ece5db;
  color: var(--text);
  padding: 20px 14px 40px;
}
.card {
  max-width: 460px; width: 100%;
  margin: 0 auto;
  background: var(--cream);
  border-radius: 22px;
  box-shadow: 0 6px 28px rgba(0,0,0,0.12);
  padding: 24px 20px 26px;
  text-align: center;
  overflow: hidden;
}
.deco { font-size: 22px; opacity: 0.7; margin-bottom: 6px; }
.eyebrow {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 9px; color: var(--text-lt);
  letter-spacing: 0.25em; margin-bottom: 14px;
}
/* ===== 画像3枚 ===== */
.shots { margin-bottom: 20px; }
.shot {
  border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  margin-bottom: 12px;
}
.shot:last-child { margin-bottom: 0; }
.shot img { width: 100%; display: block; }

/* ===== ボタン ===== */
.btn {
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  width: 100%;
  text-decoration: none;
  border-radius: 26px;
  padding: 15px 20px;
  font-size: 15px; font-weight: 700;
  letter-spacing: 0.03em;
  margin-bottom: 12px;
  transition: opacity 0.2s, transform 0.1s;
}
.btn:active { transform: translateY(1px); }
.btn:hover { opacity: 0.9; }
.btn-digital {
  background: var(--lav-dk); color: white;
  box-shadow: 0 4px 14px rgba(138,111,181,0.35);
}
.btn-pdf {
  background: white; color: var(--gold-dk);
  border: 2px solid var(--gold-bd);
}
.btn-sub { font-size: 10px; font-weight: 400; opacity: 0.85; margin-top: 3px; }
.divider { font-size: 10px; color: var(--text-lt); margin: 6px 0 10px; }

/* ===== 書き方のメッセージ ===== */
.how {
  background: white;
  border: 1.5px dashed var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  margin: 18px 0 14px;
  font-size: 12px; color: var(--text-md);
  line-height: 2;
}
/* ===== LINEへ戻る案内 ===== */
.back-line {
  background: var(--gold);
  border: 1.5px solid var(--gold-bd);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 12px; color: var(--text);
  line-height: 2;
}
.back-line .kw {
  display: inline-block;
  font-weight: 700; font-size: 14px;
  color: var(--gold-dk);
  padding: 1px 8px;
}
.dl-note {
  font-size: 9.5px; color: var(--text-lt);
  margin-top: 14px; line-height: 1.7;
}
.footer {
  margin-top: 20px; padding-top: 14px;
  border-top: 1px dashed var(--border);
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 9px; color: var(--text-lt);
}
.thanks {
  display: none; margin-top: 12px;
  font-size: 12px; color: var(--lav-dk);
  font-weight: 700; line-height: 1.8;
}
.thanks.show { display: block; }
</style>
</head>
<body>

<div class="card">
  <div class="deco">🌕</div>
  <div class="eyebrow">PISCES FULL MOON &nbsp;·&nbsp; 2026.08.28</div>

  <!-- ▼ 毎月差し替え：画像3枚 -->
  <div class="shots">
    <div class="shot"><img src="images/mangetsu-2026-08-01-cover.png" alt="8月28日 魚座満月 ここまでの私に、実りを見つける満月。"></div>
    <div class="shot"><img src="images/mangetsu-2026-08-02-theme.png" alt="今回の満月テーマ 小さな変化も、ちゃんと実り。"></div>
    <div class="shot"><img src="images/mangetsu-2026-08-03-questions.png" alt="今夜のジャーナリング 3つの問い"></div>
  </div>

  <!-- ▼ 毎月差し替え：リンク先のファイル名だけ -->
  <a class="btn btn-digital" id="digitalBtn" href="fullmoon-2026-08-worksheet.html">
    ✍️ 画面に書き込む（デジタル版）
    <span class="btn-sub">スマホ・PCでそのまま入力できます</span>
  </a>

  <div class="divider">― または ―</div>

  <a class="btn btn-pdf" id="pdfBtn" href="mangetsu-worksheet-2026-08.pdf" download>
    📄 印刷して使う（PDF版）
    <span class="btn-sub">保存・印刷してお使いいただけます</span>
  </a>

  <div class="thanks" id="thanks">
    受け取りありがとう 🌕<br>ここまで歩いてきたことが、あなたの実りです。
  </div>

  <div class="how">
    すべての問いに答えなくても大丈夫です。<br>
    今の自分に残った問いをひとつ、<br>
    やさしく眺めてみてくださいね🌿
  </div>

  <div class="back-line">
    書けたら、LINEのトーク画面に<br>
    <span class="kw">「書けた」</span><br>
    と送っていただけたら嬉しいです😊
  </div>

  <!-- ▼ 毎月差し替え：注釈 -->
  <div class="dl-note">
    ※ このワークシートは「8/28 魚座満月」のジャーナリング用です。
  </div>

  <div class="footer">🦥 モカ & こころん / Loves Life</div>
</div>

<script>
function track(path, title) {
  if (window.goatcounter && window.goatcounter.count) {
    window.goatcounter.count({ path: path, title: title, event: true });
  }
  document.getElementById('thanks').classList.add('show');
}
document.getElementById('digitalBtn').addEventListener('click', function () {
  track('open-mangetsu-digital', '満月WS デジタル版を開く');
});
document.getElementById('pdfBtn').addEventListener('click', function () {
  track('download-mangetsu-pdf', '満月WS PDFダウンロード');
});
</script>

</body>
</html>
